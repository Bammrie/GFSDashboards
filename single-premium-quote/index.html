<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Payment Protection Quote | Sign In</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="sp-header">
    <div class="sp-header__inner sp-header__inner--gateway">
      <a class="sp-back-link" href="../index.html">Back</a>
      <div class="sp-brand">
        <span class="sp-logo-mark" aria-hidden="true">GFS</span>
        <div>
          <p class="sp-kicker">Goodwine Financial Services</p>
          <h1>Payment Protection Quotes</h1>
          <p>Secure, state-specific credit insurance quoting.</p>
        </div>
      </div>
    </div>
  </header>

  <main class="sp-shell sp-auth-shell">
    <section class="sp-panel sp-auth-card" id="login-panel">
      <header class="sp-panel__header">
        <p class="sp-kicker">Authorized Users</p>
        <h2>Sign in to quote</h2>
        <p>Use the account provided by your administrator.</p>
      </header>

      <form id="quote-login-form" class="sp-form" autocomplete="on">
        <label class="sp-field" for="quote-username">
          <span>Username</span>
          <input id="quote-username" name="username" autocomplete="username" required />
        </label>
        <label class="sp-field" for="quote-password">
          <span>Password</span>
          <input id="quote-password" name="password" type="password" autocomplete="current-password" required />
        </label>
        <button type="submit" class="sp-button sp-button--primary">Sign In</button>
        <p id="quote-login-status" class="sp-status" role="status"></p>
      </form>
    </section>

    <section class="sp-panel" id="state-gateway" hidden>
      <header class="sp-panel__header sp-panel__header--compact">
        <div>
          <p class="sp-kicker">Choose a State</p>
          <h2>Start a quote</h2>
          <p id="gateway-welcome"></p>
        </div>
        <button type="button" class="sp-button sp-button--secondary sp-button--compact" id="gateway-logout">Sign Out</button>
      </header>

      <div class="sp-state-gateway-grid" id="state-links"></div>
      <div class="sp-actions sp-gateway-admin" id="admin-link-container" hidden>
        <a class="sp-button sp-button--secondary" href="admin/">Open Administration</a>
      </div>
    </section>
  </main>

  <script type="module" src="login.js"></script>
</body>
</html>
