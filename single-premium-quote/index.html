<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0b2239" />
  <title>Credit Protection Quotes</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="sp-topbar">
    <div class="sp-topbar__inner">
      <div class="sp-brand">
        <span class="sp-logo-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img">
            <path d="M12 2 20 5v6c0 5.1-3.4 9.7-8 11-4.6-1.3-8-5.9-8-11V5l8-3Z"></path>
            <path d="m8.5 12 2.2 2.2 4.8-5"></path>
          </svg>
        </span>
        <div>
          <p>Goodwine Financial Services</p>
          <h1>Credit Protection Quotes</h1>
        </div>
      </div>
    </div>
  </header>

  <main class="sp-gateway-shell">
    <section class="sp-gateway-intro">
      <p class="sp-eyebrow">Select a program</p>
      <h2>Choose a state.</h2>
      <p>Each link opens a dedicated quoting system with its own state rates.</p>
    </section>

    <div class="sp-state-grid">
      <a class="sp-state-card sp-state-card--mo" href="missouri/">
        <span class="sp-state-card__code">MO</span>
        <div>
          <h3>Missouri</h3>
          <p><span>Open quote</span><span aria-hidden="true">→</span></p>
        </div>
      </a>
      <a class="sp-state-card sp-state-card--ar" href="arkansas/">
        <span class="sp-state-card__code">AR</span>
        <div>
          <h3>Arkansas</h3>
          <p><span>Open quote</span><span aria-hidden="true">→</span></p>
        </div>
      </a>
    </div>
  </main>
</body>
</html>
